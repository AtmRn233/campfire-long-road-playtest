<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a20">
  <title>战斗演示</title>
  <script>if (window === window.parent) location.replace("../../");</script>
  <link rel="stylesheet" href="../weatherVisual.css">
  <link rel="stylesheet" href="./style.css?v=team-preparation">
</head>
<body>
  <main id="encounter-screen" class="encounter-screen" aria-labelledby="encounter-title" hidden>
    <header class="encounter-heading">
      <h1 id="encounter-title">遭遇敌军</h1>
    </header>
    <div class="encounter-layout">
      <section class="encounter-side friendly" aria-labelledby="encounter-friendly-title">
        <h2 id="encounter-friendly-title">我方</h2>
        <div id="encounter-friendly" class="encounter-roster"></div>
      </section>
      <section class="encounter-actions" aria-label="遭遇行动">
        <button id="open-parley" class="quiet" type="button" aria-haspopup="dialog">对话</button>
        <button id="withdraw-encounter" class="quiet" type="button">撤退</button>
        <button id="open-surrender" class="quiet" type="button" aria-haspopup="dialog">投降</button>
        <button class="quiet" type="button" disabled>自动战斗</button>
        <div class="encounter-deployment">
          <button id="prepare-encounter" class="quiet" type="button" data-prepare-encounter>更换装备</button>
          <button id="prepare-enemy-encounter" class="quiet" type="button" data-prepare-encounter="enemy" hidden>敌方换装（测试）</button>
          <button id="open-formation" class="quiet" type="button" aria-haspopup="dialog">布阵</button>
          <button id="open-enemy-formation" class="quiet" type="button" aria-haspopup="dialog" hidden>敌方布阵（测试）</button>
          <span id="encounter-plan"></span>
          <button id="start-encounter" class="primary" type="button">开始战斗</button>
        </div>
      </section>
      <section class="encounter-side opposing" aria-labelledby="encounter-hostile-title">
        <h2 id="encounter-hostile-title">敌方</h2>
        <div id="encounter-hostile" class="encounter-roster"></div>
      </section>
    </div>
  </main>
  <main id="battle-layout" class="layout">
    <aside class="turn-track" aria-labelledby="turn-order-title">
      <p id="round-counter"></p>
      <h2 id="turn-order-title">行动顺序</h2>
      <ol id="turn-order"></ol>
    </aside>
    <section class="theater" aria-label="战场">
      <header class="masthead">
        <div class="battle-conditions">
          <label class="terrain-control">地形 <select id="terrain" aria-label="选择战场地形"></select></label>
          <div class="weather-status">
            <span>天气</span>
            <b id="weather" aria-describedby="weather-effect"></b>
            <p id="weather-effect" role="tooltip"></p>
          </div>
        </div>
      </header>
      <div class="theater-top">
        <span class="side enemy">敌方阵线</span>
        <div class="line-reserves" role="group" aria-label="敌方预备队">
          <span class="reserve-label" aria-hidden="true">预备队</span>
          <div id="enemy-reserves" class="reserve-slots"></div>
        </div>
      </div>
      <div id="board" class="board">
        <div id="weather-visual" class="weather-visual" aria-hidden="true"></div>
        <div id="ranks"></div>
        <div id="closed-lanes"></div>
        <canvas id="aim" aria-hidden="true"></canvas>
        <div id="effects" aria-hidden="true"></div>
        <div id="battle-banner" class="battle-banner" role="status" hidden></div>
      </div>
      <div class="theater-bottom">
        <span class="side player">我方阵线</span>
        <div class="line-reserves" role="group" aria-label="我方预备队">
          <span class="reserve-label" aria-hidden="true">预备队</span>
          <div id="player-reserves" class="reserve-slots"></div>
        </div>
        <div class="field-controls">
          <div id="reinforcement-actions" hidden>
            <span id="reinforcement-hint" role="status"></span>
            <button id="finish-reinforcement" class="primary" type="button">结束补位</button>
          </div>
          <button id="restart-battle" class="primary" data-reset type="button" hidden>再打一场</button>
        </div>
      </div>
    </section>
    <aside id="battle-log" class="chronicle" aria-labelledby="log-title">
      <div class="chronicle-controls" aria-label="战场操作" role="group">
        <button id="start-battle" class="primary" data-start type="button" hidden>开始战斗</button>
        <div class="battle-options">
          <button id="open-rules" class="quiet" type="button" aria-haspopup="dialog">规则</button>
          <button id="battle-sound" class="quiet" type="button" aria-label="战斗音效" aria-pressed="true">音效开</button>
          <button id="battle-dialogue" class="quiet" type="button" aria-label="战斗对话" aria-pressed="true">对话开</button>
        </div>
        <button id="reset-battle" class="quiet" type="button" data-reset>重开</button>
      </div>
      <header class="chronicle-heading">
        <h2 id="log-title">战斗记录</h2>
        <span id="battle-phase" role="status"></span>
      </header>
      <ol id="log" aria-live="polite" tabindex="0" aria-label="战斗记录列表"></ol>
    </aside>
  </main>
  <main id="victory-screen" class="victory-screen" aria-labelledby="victory-title" hidden>
    <header class="victory-heading">
      <div><h1 id="victory-title" tabindex="-1">战斗结算</h1><p id="victory-context"></p></div>
      <button id="open-spoils" class="primary" type="button" hidden>进入搜刮</button>
      <button id="leave-battle" class="primary" type="button" hidden>离开</button>
      <button id="postbattle-reset" class="primary" data-reset type="button" hidden>再打一场</button>
    </header>
    <section id="battle-report" class="victory-panel battle-report" aria-label="我方伤害统计">
      <table>
        <thead><tr><th scope="col">队友</th><th scope="col" title="实际损失的护甲耐久和生命值合计">受到伤害</th><th scope="col">护甲伤害</th><th scope="col">生命伤害</th><th scope="col" aria-sort="descending">总输出 ↓</th></tr></thead>
        <tbody id="report-rows"></tbody>
      </table>
    </section>
    <div id="spoils-layout" class="victory-layout" hidden>
      <section class="victory-panel spoils-panel" aria-labelledby="spoils-title">
        <h2 id="spoils-title">敌人</h2>
        <div id="victory-entries" class="victory-entries">
          <section class="victory-group">
            <div class="victory-group-head"><h3>俘虏</h3><button id="execute-all" class="quiet" type="button" data-settlement-all="execute">全部处决</button></div>
            <div id="prisoner-cards" class="victory-cards"></div>
          </section>
          <section class="victory-group">
            <div class="victory-group-head"><h3>阵亡者</h3><button id="search-all" class="quiet" type="button" data-settlement-all="loot">全部搜刮</button></div>
            <h4>我方阵亡者</h4><div id="friendly-casualties" class="victory-cards"></div>
            <h4>敌方阵亡者</h4><div id="enemy-casualties" class="victory-cards"></div>
          </section>
        </div>
        <p id="enemies-cleared" class="inventory-empty" hidden>已离开战场</p>
      </section>
      <section class="victory-panel loot-panel" aria-labelledby="loot-title">
        <div class="inventory-heading">
          <h2 id="loot-title">战利品</h2>
          <div class="item-filters" data-item-panel="loot" role="group" aria-label="战利品筛选">
            <button type="button" data-item-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-item-filter="weapons" aria-pressed="false">武器</button>
            <button type="button" data-item-filter="equipment" aria-pressed="false">装备</button>
          </div>
          <button id="take-all" class="quiet" type="button">全部收取</button>
        </div>
        <p id="loot-empty" class="inventory-empty">暂无战利品</p>
        <ul id="victory-loot" class="victory-inventory" aria-live="polite" hidden></ul>
      </section>
      <aside class="victory-panel inventory-panel" aria-labelledby="inventory-title">
        <div class="inventory-heading">
          <h2 id="inventory-title">队伍物资</h2>
          <div class="item-filters" data-item-panel="inventory" role="group" aria-label="队伍物资筛选">
            <button type="button" data-item-filter="all" aria-pressed="true">全部</button>
            <button type="button" data-item-filter="weapons" aria-pressed="false">武器</button>
            <button type="button" data-item-filter="equipment" aria-pressed="false">装备</button>
          </div>
        </div>
        <p id="inventory-empty" class="inventory-empty">暂无队伍物资</p>
        <ul id="victory-inventory" class="victory-inventory" aria-live="polite" hidden></ul>
      </aside>
    </div>
    <div id="victory-actions" class="unit-actions" role="group" aria-label="人物结算操作" hidden></div>
  </main>
  <div id="unit-actions" class="unit-actions" role="group" aria-label="人物操作" hidden>
    <button id="aim-action" type="button" data-aim>攻击</button>
    <button type="button" data-skill>技能</button>
    <button id="defend-action" type="button" data-defend>防御</button>
    <button id="dodge-action" type="button" data-dodge>闪避</button>
    <button type="button" data-items>物品</button>
    <button type="button" data-information aria-haspopup="dialog">信息</button>
    <button id="move-action" type="button" data-move>移动</button>
    <button id="retreat-action" type="button" data-retreat>撤退</button>
  </div>
  <p id="notice" role="status"></p>
  <dialog id="formation-dialog" class="unit-dialog formation-dialog" aria-labelledby="formation-title">
    <header class="unit-dialog-head">
      <h2 id="formation-title">布阵</h2>
      <form method="dialog"><button class="quiet" type="submit">取消</button></form>
    </header>
    <div class="formation-content">
      <div id="formation-rows" class="formation-rows"></div>
      <footer class="formation-footer">
        <p id="formation-note" role="status" hidden>至少保留一名队员上阵。</p>
        <div id="formation-widths" class="formation-widths" role="group" aria-label="阵型宽度"></div>
        <button id="save-formation" class="primary" type="button">完成布阵</button>
      </footer>
    </div>
  </dialog>
  <dialog id="encounter-choice" class="unit-dialog leave-dialog" aria-labelledby="encounter-choice-title">
    <h2 id="encounter-choice-title"></h2>
    <div id="encounter-choice-body"></div>
    <form method="dialog">
      <button class="quiet" type="submit" autofocus>返回</button>
      <button id="confirm-encounter-surrender" class="primary" type="button" hidden>确认投降</button>
    </form>
  </dialog>
  <dialog id="unit-dialog" class="unit-dialog" aria-labelledby="unit-heading">
    <header class="unit-dialog-head">
      <div class="unit-identity"><h2 id="unit-heading"></h2><span id="unit-level" class="unit-level"></span></div>
      <form method="dialog"><button class="quiet" type="submit" aria-label="关闭人物详情">关闭</button></form>
    </header>
    <div class="unit-tabs" role="tablist" aria-label="人物详情">
      <button type="button" role="tab" id="unit-profile" data-unit-tab="profile" aria-controls="unit-view" aria-selected="true">基本信息</button>
      <button type="button" role="tab" id="unit-attributes" data-unit-tab="attributes" aria-controls="unit-view" aria-selected="false" tabindex="-1">属性</button>
      <button type="button" role="tab" id="unit-equipment" data-unit-tab="equipment" aria-controls="unit-view" aria-selected="false" tabindex="-1">装备</button>
      <button type="button" role="tab" id="unit-items" data-unit-tab="items" aria-controls="unit-view" aria-selected="false" tabindex="-1">物品</button>
      <button type="button" role="tab" id="unit-mount" data-unit-tab="mount" aria-controls="unit-view" aria-selected="false" tabindex="-1" disabled>坐骑</button>
      <button type="button" role="tab" id="unit-background" data-unit-tab="background" aria-controls="unit-view" aria-selected="false" tabindex="-1">背景</button>
      <button type="button" role="tab" id="unit-dialogue" data-unit-tab="dialogue" aria-controls="unit-view" aria-selected="false" tabindex="-1">对话</button>
    </div>
    <section id="unit-view" role="tabpanel" aria-labelledby="unit-profile" tabindex="0"></section>
  </dialog>
  <dialog id="portrait-dialog" class="portrait-dialog" aria-label="人物立绘">
    <div class="portrait-view">
      <div class="portrait-photo">
        <p id="portrait-status" role="status"></p>
        <canvas id="portrait-original" role="img" aria-label="原始立绘" hidden></canvas>
        <div id="portrait-crop" tabindex="0" aria-label="面部取景框，拖动或按方向键调整位置" hidden></div>
      </div>
      <aside class="portrait-tools">
        <form method="dialog"><button class="quiet portrait-close" type="submit" aria-label="关闭大图" autofocus>×</button></form>
        <div id="portrait-actions">
          <button id="portrait-edit" class="quiet" type="button" disabled>重选面部</button>
          <button class="quiet" type="button" disabled>重新生成</button>
        </div>
        <figure id="portrait-result" hidden>
          <figcaption>卡片预览</figcaption>
          <canvas id="portrait-selected" width="84" height="126" role="img" aria-label="当前面部取景"></canvas>
        </figure>
      </aside>
    </div>
    <footer id="portrait-controls" hidden>
      <label for="portrait-size">框选大小</label>
      <input id="portrait-size" type="range" min="18" max="100" step="1">
      <button id="portrait-save" class="primary" type="button">保存</button>
    </footer>
  </dialog>
  <dialog id="leave-dialog" class="unit-dialog leave-dialog" aria-labelledby="leave-title" aria-describedby="leave-message">
    <h2 id="leave-title">离开战场？</h2>
    <p id="leave-message"></p>
    <form method="dialog">
      <button class="quiet" type="submit" autofocus>继续搜刮</button>
      <button id="confirm-leave" class="primary" type="button">确认离开</button>
    </form>
  </dialog>
  <div id="attack-details" class="attack-details" role="region" aria-label="攻击判定详情" hidden></div>
  <div id="reach-details" class="reach-details" role="tooltip" hidden></div>
